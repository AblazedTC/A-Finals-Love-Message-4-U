<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>You Can Get Through Finals Szn!</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="https://unpkg.com/@sakun/system.css" />
    </head>

    <body>
        <div id="hearts-bg"></div>
        <div class="container">
            <div class="button-wrapper">
                <button class="btn" id="letterButton">
                    💌 Cutesy Self-Love Letter
                </button>
                <button class="btn" id="refreshButton">
                    ✨ Inspirational Images
                </button>
            </div>

            <div id="valentines-container"></div>

            <div id="letterOverlay" class="overlay hidden">
                <div class="letter-box">
                    <h2>To You 💛</h2>
                    <textarea id="letterText">
You are the best CS student in the world <3
Finals will be over soon, and you can rest...
You're almost there pookie, don't give up!
                    </textarea>
                    <button class="btn close-btn" id="closeLetter">
                        Close
                    </button>
                </div>
            </div>

            <div class="standard-dialog center scale-down">
                <p class="dialog-text">
                    ❤ Lots o'love ColorStack! &copy; 2026
                </p>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
        <script src="./index.js"></script>
    </body>
</html>
